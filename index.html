<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Cloud Demo</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
            background-color: #f4f4f4;
        }

        h1 {
            color: #2c3e50;
        }

        .box {
            background: white;
            padding: 30px;
            width: 60%;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Cloud Computing Demo</h1>
        <p>This website is running on Cloud (Vercel)</p>
        <p id="time"></p>
    </div>

    <script>
        function updateTime() {
            document.getElementById("time").innerText =
                "Current time: " + new Date().toLocaleString();
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>

</body>

</html>
